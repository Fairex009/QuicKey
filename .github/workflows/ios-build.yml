name: Build unsigned QuicKey IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'QuicKeyApp/**'
      - 'QuicKeyKeyboard/**'
      - 'scripts/template_checks.swift'
      - 'project.yml'
      - 'scripts/generate_app_icon.swift'
      - 'scripts/delete_checks.swift'
      - 'QuicKeyKeyboard/KeyboardPreferences.swift'
      - 'scripts/preferences_checks.swift'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: iOS device build, no signing
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify FAIREX command templates
        run: |
          set -euo pipefail
          swiftc QuicKeyKeyboard/CommandTemplates.swift QuicKeyKeyboard/PromptHistory.swift scripts/template_checks.swift -o /tmp/quickey-template-checks
          swiftc QuicKeyKeyboard/CommandTemplates.swift QuicKeyKeyboard/DeletePlanner.swift scripts/delete_checks.swift -o /tmp/quickey-delete-checks
          /tmp/quickey-delete-checks
          /tmp/quickey-template-checks
          swiftc QuicKeyKeyboard/KeyboardPreferences.swift scripts/preferences_checks.swift -o /tmp/quickey-preferences-checks
          /tmp/quickey-preferences-checks
      - name: Validate scrollable preview and source structure
        run: python3 scripts/verify_source.py
      - name: Generate the 1024-pixel app icon
        run: |
          set -euo pipefail
          swift scripts/generate_app_icon.swift QuicKeyApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          sips -g pixelWidth -g pixelHeight QuicKeyApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build app and keyboard extension
        run: |
          set -euo pipefail
          xcodebuild \
            -project QuicKey.xcodeproj \
            -scheme QuicKey \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.derivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=' \
            build
      - name: Verify embedded keyboard extension and package unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/.derivedData/Build/Products/Release-iphoneos/QuicKey.app"
          EXT="$APP/PlugIns/QuicKeyKeyboard.appex"
          test -d "$APP" || { echo 'Missing host .app'; exit 1; }
          test -d "$EXT" || { echo 'Missing embedded keyboard .appex'; exit 1; }
          test -f "$EXT/QuicKeyKeyboard" || { echo 'Missing keyboard executable'; exit 1; }
          TYPE=$(/usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")
          test "$TYPE" = 'com.apple.keyboard-service' || { echo 'Wrong extension type'; exit 1; }
          ACCESS=$(/usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionAttributes:RequestsOpenAccess' "$EXT/Info.plist")
          test "$ACCESS" = 'false' || { echo 'Unexpected Full Access requirement'; exit 1; }
          MAIN_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          EXT_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$EXT/Info.plist")
          test "$MAIN_ID" = 'org.quickey.prototype'
          test "$EXT_ID" = 'org.quickey.prototype.keyboard'
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          EXT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$EXT/Info.plist")
          test "$VERSION" = "$EXT_VERSION"
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          EXT_BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$EXT/Info.plist")
          test "$BUILD" = "$EXT_BUILD"
          test -s "$APP/Assets.car" || { echo 'Missing compiled asset catalog'; exit 1; }
          ICON=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist")
          test "$ICON" = 'AppIcon' || { echo "App icon not set: $ICON"; exit 1; }
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qr QuicKey-unsigned.ipa Payload)
          unzip -l dist/QuicKey-unsigned.ipa | grep -q 'QuicKeyKeyboard.appex/Info.plist'
          echo 'PASS: app, keyboard extension, preserved IDs, no Full Access.'
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuicKey-unsigned-IPA
          path: dist/QuicKey-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
